version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: projectiii_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectiii
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: projectiii_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: projectiii_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/projectiii?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=super_secret_access_key_projectiii
      - JWT_REFRESH_SECRET=super_secret_refresh_key_projectiii
      - JWT_ACCESS_EXPIRATION=7d
      - JWT_REFRESH_EXPIRATION=7d
      - GOOGLE_CLIENT_ID=443299735874-6lrjdfhfu30n7svv8aukss52dohggfim.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: projectiii_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  postgres_data:

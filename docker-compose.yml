version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: projectiii_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectiii
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: projectiii_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: projectiii_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/projectiii?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=super_secret_access_key_projectiii
      - JWT_REFRESH_SECRET=super_secret_refresh_key_projectiii
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: projectiii_frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  postgres_data:
